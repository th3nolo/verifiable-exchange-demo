name: Bug report
description: Report a reproducible problem that is not a security vulnerability.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: >-
        Do not include keys, tokens, private addresses, account data, or exploit
        details. Use the private security advisory link for vulnerabilities.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: State the observed result and the result you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >-
        Include the smallest sequence of commands, messages, or requests that
        reproduces the problem.
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Paste the full source commit or the build_commit reported by /market.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted output
      description: Include only the lines needed to show the failure.

  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report contains no vulnerability or private operational detail.
          required: true
